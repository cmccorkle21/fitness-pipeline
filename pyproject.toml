[project]
name = "fitness-pipeline"
version = "0.1.0"
description = "Personal Hevy workout analytics"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "plotly>=5.24", "streamlit>=1.40", "python-dotenv>=1.0", "requests>=2.32", "pushover>=0.5"]

[project.scripts]
fitness-sync = "fitness_pipeline.cli:main"
fitness-log = "fitness_pipeline.log_cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
